# Shared settings. Secrets and environment-specific values come from backend/.env
# (git-ignored; copy .env.example). Switching local -> cloud = change .env only.
spring:
  application:
    name: vihan-hospital
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: vihan-pool
      # The app's own schema (like the VIHAN_APP schema on Oracle), not PostgreSQL's shared "public".
      # All SQL is unqualified; this sets each connection's search_path.
      schema: ${DB_SCHEMA:vihanhspl}
      # Column defaults (LOCALTIMESTAMP) and DATE_TRUNC work in IST, whatever the server's zone.
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
          fetch_size: 100
  flyway:
    locations: classpath:db/migration
    # Creates the schema if it's missing and keeps its history table (flyway_schema_history) there.
    schemas: ${DB_SCHEMA:vihanhspl}
    default-schema: ${DB_SCHEMA:vihanhspl}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  sample-data: false
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  file-storage: ${FILE_STORAGE:database}   # database (default) | disk (then upload-dir is used)
  upload-dir: ${UPLOAD_DIR:./uploads}
  public-file-base-url: ${PUBLIC_FILE_BASE_URL:/files}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: 30          # DESIGN.md §12.2
    refresh-token-hours: 8            # one shift; not extended by refreshing
    max-failed-attempts: 5
    lock-minutes: 15
    cookie-secure: true               # browsers accept Secure cookies on http://localhost too
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    dev-sample-password: ${DEV_SAMPLE_PASSWORD:}
  scheduling:
    window-days: 14                   # rolling booking window (DESIGN.md §17 #5)
    max-generate-days: 60             # "Generate" button may go this far ahead
    generate-on-startup: true         # catch up if the server was down at the nightly run
  booking:
    min-lead-minutes: 30              # public can't book a slot starting sooner (they should arrive 15 min early)
    cancel-cutoff-minutes: 60         # patient cancel / reschedule closes 1 h before the slot (§17 #7)
    max-reschedules: 2                # per booking, by the patient (FR-B3a)
    max-per-mobile-per-day: 3         # active online bookings per mobile per date (§17 #6)
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}  # false only for offline development
    secret-key: ${TURNSTILE_SECRET_KEY:}
    expected-hostname: ${TURNSTILE_HOSTNAME:}   # blank = don't check (test keys report example.com)
  aadhaar:                          # DESIGN.md §10.7: Base64 of 32 random bytes each; required
    enc-key: ${AADHAAR_ENC_KEY:}      # AES-256-GCM (losing it makes stored numbers unreadable)
    hash-key: ${AADHAAR_HASH_KEY:}    # HMAC-SHA256 for search / uniqueness (changing it breaks search)
  rate-limit:
    booking-per-minute: 10            # per IP: book / cancel / reschedule (§12.4)
    lookup-per-minute: 30             # per IP: check booking
    slots-per-minute: 60              # per IP: viewing free slots
    login-per-minute: 20              # per IP: staff login attempts (accounts also lock after 5 failures)
