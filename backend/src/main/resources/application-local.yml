# Local development on your PC: Oracle Database Free (Docker), sample data, Swagger on.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev-data

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.vihan.hospital: DEBUG

app:
  sample-data: true
  email:
    form-enabled: true                # provider stays "log": the email is only written to the log
